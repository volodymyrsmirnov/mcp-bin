name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.github/workflows/release.yml'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next version
        id: bump
        run: |
          latest=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -z "$latest" ]; then
            echo "tag=v0.2.0" >> "$GITHUB_OUTPUT"
          else
            patch=$(echo "$latest" | cut -d. -f3)
            prefix=$(echo "$latest" | cut -d. -f1-2)
            echo "tag=${prefix}.$((patch + 1))" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${{ needs.version.outputs.tag }}"
          COMMIT="$(git rev-parse --short HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w"
          LDFLAGS="$LDFLAGS -X github.com/volodymyrsmirnov/mcp-bin/internal/version.Version=$VERSION"
          LDFLAGS="$LDFLAGS -X github.com/volodymyrsmirnov/mcp-bin/internal/version.Commit=$COMMIT"
          LDFLAGS="$LDFLAGS -X github.com/volodymyrsmirnov/mcp-bin/internal/version.Date=$DATE"
          go build -ldflags="$LDFLAGS" -o mcp-bin-${{ matrix.suffix }} ./cmd/mcp-bin/

      - uses: actions/upload-artifact@v4
        with:
          name: mcp-bin-${{ matrix.suffix }}
          path: mcp-bin-${{ matrix.suffix }}

  universal:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mcp-bin-darwin-amd64

      - uses: actions/download-artifact@v4
        with:
          name: mcp-bin-darwin-arm64

      - name: Create universal binary
        run: |
          chmod +x mcp-bin-darwin-amd64 mcp-bin-darwin-arm64
          lipo -create -output mcp-bin-osx-universal mcp-bin-darwin-amd64 mcp-bin-darwin-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: mcp-bin-osx-universal
          path: mcp-bin-osx-universal

  release:
    needs: [version, build, universal]
    runs-on: ubuntu-latest
    outputs:
      sha_osx: ${{ steps.checksums.outputs.sha_osx }}
      sha_linux_amd64: ${{ steps.checksums.outputs.sha_linux_amd64 }}
      sha_linux_arm64: ${{ steps.checksums.outputs.sha_linux_arm64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Compute checksums
        id: checksums
        run: |
          echo "sha_osx=$(sha256sum artifacts/mcp-bin-osx-universal | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "sha_linux_amd64=$(sha256sum artifacts/mcp-bin-linux-amd64 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "sha_linux_arm64=$(sha256sum artifacts/mcp-bin-linux-arm64 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f artifacts/mcp-bin-darwin-amd64 artifacts/mcp-bin-darwin-arm64
          gh release create "${{ needs.version.outputs.tag }}" \
            --title "${{ needs.version.outputs.tag }}" \
            --generate-notes \
            artifacts/*

  homebrew:
    needs: [version, release]
    uses: volodymyrsmirnov/homebrew-tap/.github/workflows/update.yml@main
    with:
      type: formula
      name: mcp-bin
      version: ${{ needs.version.outputs.tag }}
      desc: "Turn MCP server tools into CLI commands"
      homepage: "https://github.com/volodymyrsmirnov/mcp-bin"
      macos_url: "https://github.com/volodymyrsmirnov/mcp-bin/releases/download/${{ needs.version.outputs.tag }}/mcp-bin-osx-universal"
      macos_sha256: ${{ needs.release.outputs.sha_osx }}
      linux_amd64_url: "https://github.com/volodymyrsmirnov/mcp-bin/releases/download/${{ needs.version.outputs.tag }}/mcp-bin-linux-amd64"
      linux_amd64_sha256: ${{ needs.release.outputs.sha_linux_amd64 }}
      linux_arm64_url: "https://github.com/volodymyrsmirnov/mcp-bin/releases/download/${{ needs.version.outputs.tag }}/mcp-bin-linux-arm64"
      linux_arm64_sha256: ${{ needs.release.outputs.sha_linux_arm64 }}
      formula_install: |-
        binary = Dir["mcp-bin-*"].first
            bin.install binary => "mcp-bin"
    secrets:
      tap_token: ${{ secrets.TAP_GITHUB_TOKEN }}
